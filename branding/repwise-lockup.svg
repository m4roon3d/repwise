<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1a2d"/>
      <stop offset="100%" stop-color="#060a12"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101a2e"/>
      <stop offset="100%" stop-color="#070b13"/>
    </linearGradient>
    <linearGradient id="accent" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.5" r="0.6">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <!-- ascending rep bars, faint, bottom right -->
  <g fill="url(#accent)" opacity="0.10">
    <rect x="820" y="500" width="56" height="70" rx="14"/>
    <rect x="900" y="465" width="56" height="105" rx="14"/>
    <rect x="980" y="430" width="56" height="140" rx="14"/>
    <rect x="1060" y="395" width="56" height="175" rx="14"/>
  </g>
  <!-- mark tile -->
  <g transform="translate(120 175) scale(0.55)">
    <rect width="512" height="512" rx="112" fill="url(#tile)" stroke="#1e2b44" stroke-width="3"/>
    <path d="M168 136 V380 M168 136 H216 A78 78 0 0 1 216 292 H168 M236 298 L336 380" fill="none" stroke="url(#accent)" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M212 228 L234 204 L256 228" fill="none" stroke="#e6fffb" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="450" y="342" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="132" font-weight="700" letter-spacing="-3" fill="#f1f5f9">Rep<tspan fill="url(#accent)">wise</tspan></text>
  <text x="454" y="410" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="500" fill="#94a3b8">Your plan. Your reps. Your AI coach.</text>
</svg>
